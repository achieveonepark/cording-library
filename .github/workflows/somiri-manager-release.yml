name: Build Somiri Manager

# tools/somiri-manager (Tauri 데스크톱 앱)를 각 OS 네이티브 설치파일로 빌드해
# GitHub Release 에 업로드한다. 수동 실행(workflow_dispatch) 또는 전용 태그 푸시로 트리거.
on:
  workflow_dispatch:
  push:
    tags:
      - 'somiri-manager-v*'
    # 워크플로 자체나 앱 버전(tauri.conf.json)이 main 에서 바뀌면 릴리스 빌드를 돈다.
    branches: [main]
    paths:
      - '.github/workflows/somiri-manager-release.yml'
      - 'tools/somiri-manager/src-tauri/tauri.conf.json'

permissions:
  contents: write

defaults:
  run:
    working-directory: tools/somiri-manager

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon + Intel (universal)
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tools/somiri-manager/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl wget file libxdo-dev libssl-dev
        working-directory: .

      - name: Install frontend dependencies
        run: npm install

      - name: Build app and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tools/somiri-manager
          tagName: somiri-manager-v__VERSION__
          releaseName: 'Somiri Manager v__VERSION__'
          releaseBody: '각 OS용 설치파일을 아래 Assets 에서 다운로드해 설치하세요. (코드 서명 없음 — 최초 실행 시 OS 보안 경고가 뜰 수 있습니다.)'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
