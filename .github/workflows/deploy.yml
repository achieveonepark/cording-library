name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 각 패키지 레포 정보 (실제 URL / Docusaurus 프로젝트 경로는 추후 수정)
# 형식: "이름|레포URL|Docusaurus프로젝트경로(docusaurus.config 가 있는 폴더)"
env:
  PACKAGES: |
    AchEngine|https://github.com/achieveonepark/AchEngine|Docs~
    AchUtils|https://github.com/achieveonepark/AchUtils|Docs~
    npc-mentality|https://github.com/achieveonepark/npc-mentality|Docs~
    lite-db|https://github.com/achieveonepark/lite-db|Docs~

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 한 번만 배포
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci || npm install

      # 1. VitePress 랜딩 빌드 → site/ 루트에 배치
      #    (docs.somiri.dev/ 가 패키지 카드 랜딩)
      - name: Build landing (VitePress)
        run: npm run docs:build

      - name: Assemble site
        run: |
          mv .vitepress/dist site
          echo 'docs.somiri.dev' > site/CNAME

      # 2. 각 패키지의 Docusaurus 를 baseUrl=/패키지명/ 으로 빌드해
      #    site/패키지명/ 으로 합친다.
      #  - private 레포면 DOCS_TOKEN 시크릿(PAT) 필요
      #  - 클론/빌드 실패 시 해당 패키지만 건너뛰고 계속 진행
      - name: Build package docs (Docusaurus)
        env:
          DOCS_TOKEN: ${{ secrets.DOCS_TOKEN }}
        run: |
          set -uo pipefail

          if [ -n "${DOCS_TOKEN:-}" ]; then
            git config --global \
              url."https://x-access-token:${DOCS_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
          fi

          while IFS='|' read -r name repo path; do
            [ -z "${name// }" ] && continue
            name="$(echo "$name" | xargs)"
            repo="$(echo "$repo" | xargs)"
            path="$(echo "$path" | xargs)"

            echo "::group::$name ($repo)"
            tmp="$(mktemp -d)"
            proj="$tmp/$path"

            if ! git clone --depth=1 "$repo" "$tmp"; then
              echo "::warning::$repo 클론 실패 — $name 건너뜀"
            else
              cfg=""
              [ -f "$proj/docusaurus.config.ts" ] && cfg="$proj/docusaurus.config.ts"
              [ -z "$cfg" ] && [ -f "$proj/docusaurus.config.js" ] && cfg="$proj/docusaurus.config.js"

              if [ -z "$cfg" ]; then
                echo "::warning::$repo '$path' 에 docusaurus.config 없음 — $name 건너뜀"
              else
                # baseUrl / url 을 통합 도메인 기준으로 덮어쓴다
                sed -i -E "s#^([[:space:]]*)baseUrl:[[:space:]]*'[^']*'#\1baseUrl: '/${name}/'#" "$cfg"
                sed -i -E "s#^([[:space:]]*)url:[[:space:]]*'[^']*'#\1url: 'https://docs.somiri.dev'#" "$cfg"

                if ( cd "$proj" && { npm ci || npm install; } && npm run build ) && [ -d "$proj/build" ]; then
                  mkdir -p "$GITHUB_WORKSPACE/site/$name"
                  cp -R "$proj/build/." "$GITHUB_WORKSPACE/site/$name/"
                else
                  echo "::warning::$name Docusaurus 빌드 실패 — 건너뜀"
                fi
              fi
            fi

            rm -rf "$tmp"
            echo "::endgroup::"
          done <<< "$PACKAGES"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
