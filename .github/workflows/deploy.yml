name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 통합할 패키지 레포 목록 (모두 achieveonepark/<name>, 문서는 docs~/ Fumadocs)
env:
  PACKAGES: >-
    skill-creator lite-db infinity-value cheat-terminal breeze-iap data-protector
    achieve-package-manager npc-mentality AchUtils quick-save AchEngine

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install landing dependencies
        run: npm ci || npm install

      # 1. Fumadocs 랜딩(패키지 목록) 빌드 → site/ 루트
      - name: Build landing (Fumadocs)
        run: npm run build

      - name: Assemble site root
        run: |
          mv out site
          echo 'docs.somiri.dev' > site/CNAME
          touch site/.nojekyll

      # 2. 각 패키지의 Fumadocs(docs~) 를 정적 빌드해 site/<name>/ 으로 합친다.
      #    각 패키지 next.config 의 basePath 가 이미 /<name> 이라 그대로 맞는다.
      - name: Build package docs (Fumadocs)
        run: |
          set -uo pipefail
          for name in $PACKAGES; do
            echo "::group::$name"
            tmp="$(mktemp -d)"
            if ! git clone --depth=1 "https://github.com/achieveonepark/${name}.git" "$tmp"; then
              echo "::warning::$name 클론 실패 — 건너뜀"
            elif [ ! -d "$tmp/docs~" ]; then
              echo "::warning::$name 에 docs~ 없음 — 건너뜀"
            elif ( cd "$tmp/docs~" && { npm ci || npm install --no-audit --no-fund; } && npm run build ) && [ -d "$tmp/docs~/out" ]; then
              mkdir -p "$GITHUB_WORKSPACE/site/$name"
              cp -R "$tmp/docs~/out/." "$GITHUB_WORKSPACE/site/$name/"
              echo "$name OK"
            else
              echo "::warning::$name 빌드 실패 — 건너뜀"
            fi
            rm -rf "$tmp"
            echo "::endgroup::"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
