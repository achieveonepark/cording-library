name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 각 패키지 레포 정보 (실제 URL / docs 경로는 추후 수정)
# 형식: "이름|레포URL|docs경로"
env:
  PACKAGES: |
    AchEngine|https://github.com/somiri/AchEngine|docs
    AchUtils|https://github.com/somiri/AchUtils|docs
    npc-mentality|https://github.com/somiri/npc-mentality|docs
    lite-db|https://github.com/somiri/lite-db|docs

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 한 번만 배포 (진행 중인 배포는 취소하지 않고 큐잉)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci || npm install

      # 1. 각 패키지 레포를 --depth=1 클론
      # 2. 각 docs 폴더를 ./docs/패키지명/ 으로 복사
      - name: Fetch package docs
        run: |
          set -euo pipefail
          while IFS='|' read -r name repo path; do
            # 빈 줄 / 공백 라인 skip
            [ -z "${name// }" ] && continue
            name="$(echo "$name" | xargs)"
            repo="$(echo "$repo" | xargs)"
            path="$(echo "$path" | xargs)"

            echo "::group::$name ($repo)"
            tmp="$(mktemp -d)"
            git clone --depth=1 "$repo" "$tmp"

            mkdir -p "./docs/$name"
            cp -R "$tmp/$path/." "./docs/$name/"
            rm -rf "$tmp"
            echo "::endgroup::"
          done <<< "$PACKAGES"

      # 3. VitePress 빌드
      - name: Build
        run: npm run docs:build

      # 4. 빌드 결과물 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
