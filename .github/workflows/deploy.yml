name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 각 패키지 레포 정보 (실제 URL / docs 경로는 추후 수정)
# 형식: "이름|레포URL|docs경로"
env:
  PACKAGES: |
    AchEngine|https://github.com/achieveonepark/AchEngine|Docs~/docs
    AchUtils|https://github.com/achieveonepark/AchUtils|Docs~/docs
    npc-mentality|https://github.com/achieveonepark/npc-mentality|Docs~/docs
    lite-db|https://github.com/achieveonepark/lite-db|Docs~/docs

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 한 번만 배포
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci || npm install

      # 1. 각 패키지 레포를 --depth=1 클론
      # 2. 각 docs 폴더를 ./패키지명/ 으로 복사 (base 가 /docs/ 이므로 루트에 둠)
      #  - private 레포라면 DOCS_TOKEN 시크릿(PAT, repo 읽기 권한) 필요
      #  - 클론 실패 시 해당 패키지만 건너뛰고 빌드는 계속 진행
      - name: Fetch package docs
        env:
          DOCS_TOKEN: ${{ secrets.DOCS_TOKEN }}
        run: |
          set -uo pipefail

          # private 레포 접근용 토큰이 있으면 github.com 클론에 주입
          if [ -n "${DOCS_TOKEN:-}" ]; then
            git config --global \
              url."https://x-access-token:${DOCS_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
          fi

          while IFS='|' read -r name repo path; do
            [ -z "${name// }" ] && continue
            name="$(echo "$name" | xargs)"
            repo="$(echo "$repo" | xargs)"
            path="$(echo "$path" | xargs)"

            echo "::group::$name ($repo)"
            tmp="$(mktemp -d)"
            if ! git clone --depth=1 "$repo" "$tmp"; then
              echo "::warning::$repo 클론 실패 — $name 건너뜀"
            elif [ ! -d "$tmp/$path" ]; then
              echo "::warning::$repo 에 '$path' 경로 없음 — $name 건너뜀"
            else
              mkdir -p "./$name"
              cp -R "$tmp/$path/." "./$name/"
              # Unity .meta 등 문서와 무관한 파일 제거
              find "./$name" -name '*.meta' -delete
            fi
            rm -rf "$tmp"
            echo "::endgroup::"
          done <<< "$PACKAGES"

      # 3. VitePress 빌드
      - name: Build
        run: npm run docs:build

      # 4. dist 를 /docs 하위로 감싸고 도메인/리다이렉트 추가
      #    somiri.dev/docs/... 로 서빙되도록 site/docs/ 구조로 만든다.
      - name: Wrap site under /docs
        run: |
          mkdir -p site
          mv .vitepress/dist site/docs
          echo 'somiri.dev' > site/CNAME
          # 루트(somiri.dev) 접속 시 /docs 로 리다이렉트
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=/docs/">\n' > site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
