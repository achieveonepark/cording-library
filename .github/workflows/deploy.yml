name: Deploy docs to Cloudflare Pages

# 트리거:
#  - main 푸시: 랜딩/목록 변경 시 전체 재조립·배포
#  - repository_dispatch(docs-updated): 각 패키지 레포가 docs~ 변경 시 자동 호출
#  - workflow_dispatch: Actions UI 수동 실행(특정 패키지명 입력 시 해당 패키지만 강제 재빌드)
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:
    inputs:
      package:
        description: '강제 재빌드할 패키지 (기본값 = 변경분만 캐시 기반)'
        required: false
        type: choice
        default: '변경분만 (force 없음)'
        # ⚠️ 새 패키지 추가 시 packages.json 과 이 목록을 함께 갱신할 것
        options:
          - '변경분만 (force 없음)'
          - AchReactive
          - AchEngine
          - AchUtils
          - npc-mentality
          - infinity-value
          - cheat-terminal
          - breeze-iap
          - data-protector
          - quick-save
          - achieve-package-manager
          - lite-db
          - ach-economy
          - ach-tempo

permissions:
  contents: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  # 1) packages.json 을 읽어 패키지 매트릭스를 동적으로 생성한다(단일 소스).
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate package matrix
        id: gen
        run: |
          matrix=$(jq -c '[.[].name]' packages.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "packages: $matrix"

  # 2) 랜딩(패키지 목록) 빌드 → landing 아티팩트
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: landing
          path: out
          retention-days: 1

  # 3) 각 패키지 문서를 매트릭스로 빌드. 커밋 SHA 로 캐싱하여
  #    변경 없는 패키지는 빌드를 건너뛰고 캐시를 그대로 사용한다.
  package:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Resolve latest commit SHA
        id: sha
        run: |
          sha=$(git ls-remote "https://github.com/achieveonepark/${{ matrix.package }}.git" HEAD | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.package }} -> ${sha:-<none>}"

      # workflow_dispatch 로 특정 패키지를 지정하면 캐시를 무시하고 강제 재빌드한다.
      - name: Decide force rebuild
        id: force
        run: |
          if [ -n "${{ github.event.inputs.package }}" ] && [ "${{ github.event.inputs.package }}" = "${{ matrix.package }}" ]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore cached build
        id: cache
        if: steps.sha.outputs.sha != '' && steps.force.outputs.force != 'true'
        uses: actions/cache@v4
        with:
          path: pkgsite
          key: pkgdocs-${{ matrix.package }}-${{ steps.sha.outputs.sha }}

      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true' && steps.sha.outputs.sha != ''
        with:
          node-version: 22

      - name: Build package docs (cache miss)
        if: steps.cache.outputs.cache-hit != 'true' && steps.sha.outputs.sha != ''
        run: |
          set -uo pipefail
          tmp="$(mktemp -d)"
          if ! git clone --depth=1 "https://github.com/achieveonepark/${{ matrix.package }}.git" "$tmp"; then
            echo "::warning::${{ matrix.package }} 클론 실패 — 건너뜀"
          elif [ ! -d "$tmp/docs~" ]; then
            echo "::warning::${{ matrix.package }} 에 docs~ 없음 — 건너뜀"
          elif ( cd "$tmp/docs~" && { npm ci || npm install --no-audit --no-fund; } && npm run build ) && [ -d "$tmp/docs~/out" ]; then
            mkdir -p "$GITHUB_WORKSPACE/pkgsite"
            cp -R "$tmp/docs~/out/." "$GITHUB_WORKSPACE/pkgsite/"
            echo "${{ matrix.package }} 빌드 완료"
          else
            echo "::warning::${{ matrix.package }} 빌드 실패 — 건너뜀"
          fi
          rm -rf "$tmp"

      # 빌드/캐시 결과(pkgsite)를 패키지별 아티팩트로 업로드.
      # docs~ 가 없거나 실패해 비어 있으면 업로드를 건너뛴다.
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.package }}
          path: pkgsite
          if-no-files-found: ignore
          retention-days: 1

  # 4) 전체 정적 사이트를 전용 브랜치에 저장하고 Cloudflare Pages 배포를 확인한다.
  deploy:
    needs: [landing, package]
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://somiri-docs.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          path: publisher

      - name: Download landing
        uses: actions/download-artifact@v4
        with:
          name: landing
          path: site

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: pkgs

      - name: Assemble site
        run: |
          set -e
          shopt -s nullglob
          for d in pkgs/pkg-*; do
            name="${d#pkgs/pkg-}"
            if [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
              mkdir -p "site/$name"
              cp -R "$d/." "site/$name/"
              echo "merged $name"
            else
              echo "skip empty $name"
            fi
          done
          # 패키지 문서가 빠진 사이트로 기존 정상 배포를 덮어쓰지 않는다.
          for name in $(jq -r '.[].name' publisher/packages.json); do
            test -f "site/$name/index.html" || { echo "::error::Missing docs: $name"; exit 1; }
          done
          node -e 'require("fs").writeFileSync("site/deployment.json", JSON.stringify({ source_commit: process.env.GITHUB_SHA, run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT }))'

      - name: Publish assembled site branch
        id: publish
        working-directory: publisher
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --local user.name achieveonepark
          git config --local user.email park_achieveone@naver.com
          if git ls-remote --exit-code --heads origin cloudflare-pages; then
            git fetch origin cloudflare-pages
            git switch --force-create cloudflare-pages FETCH_HEAD
          else
            git switch --orphan cloudflare-pages
          fi
          rsync -a --delete --exclude=.git ../site/ ./
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish docs from $SOURCE_COMMIT"
          fi
          git push origin HEAD:refs/heads/cloudflare-pages
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger and verify Cloudflare Pages deployment
        uses: actions/github-script@v7
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        with:
          script: |
            const hook = process.env.CLOUDFLARE_DEPLOY_HOOK;
            if (!hook) throw new Error('CLOUDFLARE_DEPLOY_HOOK secret is not configured');
            const response = await fetch(hook, { method: 'POST' });
            if (!response.ok) throw new Error(`Cloudflare deploy hook returned ${response.status}`);
            const result = await response.json();
            if (result.success === false) throw new Error('Cloudflare rejected the deployment');
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              const deployment = await fetch(`https://somiri-docs.pages.dev/deployment.json?verify=${Date.now()}`)
                .then(response => response.ok ? response.json() : null).catch(() => null);
              if (deployment?.source_commit === process.env.GITHUB_SHA && deployment?.run_id === process.env.GITHUB_RUN_ID && deployment?.run_attempt === process.env.GITHUB_RUN_ATTEMPT) {
                core.info(`Cloudflare Pages serves ${deployment.source_commit} (run ${deployment.run_id})`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Timed out waiting for Cloudflare Pages deployment');
